[tox]
env_list = lint, ansible-lint
skip_missing_interpreters = true

[testenv:lint]
description = Run Python syntax, static analysis, import ordering, and formatting checks
skip_install = true
deps =
    -r requirements-lint.txt
commands =
    python -m compileall -q install.py plugins docs/conf.py
    ruff check install.py plugins docs/conf.py
    black --check --diff install.py plugins docs/conf.py
    isort --check-only --diff install.py plugins docs/conf.py

[testenv:ansible-lint]
description = Run strict Ansible content linting
skip_install = true
deps =
    -r requirements-lint.txt
commands =
    ansible-lint playbooks roles tasks meta
