---
name: Lint

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lint.txt

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lint.txt

      - name: Check Python syntax
        run: python -m compileall -q install.py plugins docs/conf.py

      - name: Run Ruff
        run: ruff check install.py plugins docs/conf.py

      - name: Check Black formatting
        run: black --check --diff install.py plugins docs/conf.py

      - name: Check import ordering
        run: isort --check-only --diff install.py plugins docs/conf.py

  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lint.txt

      - name: Install lint and collection dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lint.txt
          python -m pip install -r requirements.txt

      - name: Run Ansible lint
        run: ansible-lint playbooks roles tasks meta
